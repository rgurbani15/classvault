name = "classvault-smart-import"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Cloudflare Workers AI through a binding: no API key exists anywhere in this project.
[ai]
binding = "AI"

[vars]
# Llama 3.1 8B Instruct: on Cloudflare's JSON-mode list, ~50 Neurons per request at the free daily 10,000 Neuron allocation.
# Llama licence/AUP applies: https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/LICENSE  (Built with Llama)
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
ALLOWED_ORIGINS = "*"
RATE_PER_MINUTE = "3"
RATE_PER_DAY = "10"
RATE_IP_PER_DAY = "30"
RATE_GLOBAL_PER_DAY = "100"
MAX_INPUT_CHARS = "4000"
MAX_OUTPUT_TOKENS = "1500"
AI_TIMEOUT_MS = "20000"

# Rate-limit counters. Create with:  npx wrangler kv namespace create RATE_KV  then paste the id and uncomment:
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "PASTE_ID_HERE"
