<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const K='classvault.v1',$=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||typeof S!='object'||!Array.isArray(S.classes)||!Array.isArray(S.items))S={user:null,classes:[],items:[]};
S.classes=S.classes.filter(c=>c&&c.id&&c.name);
S.items=S.items.filter(i=>i&&i.id&&i.title&&['assignment','note','link','file'].includes(i.type)).map(i=>({...i,status:['todo','progress','done'].includes(i.status)?i.status:'todo',due:/^\d{4}-\d\d-\d\d$/.test(i.due||'')?i.due:'',desc:i.desc||'',link:i.link||'',est:+i.est>0?Math.min(+i.est,1440):0,actual:+i.actual>0?Math.min(+i.actual,1440):0}));

const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save. Storage may be full.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',vault:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',classes:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M7 10v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',assignment:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>',note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',file:'<path d="M20 12l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',back:'<path d="M15 5l-7 7 7 7"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const IC=new Proxy({},{get:(_,k)=>ic(k)}),TN={assignment:'Assignment',note:'Note',link:'Link',file:'File'};
const ST={todo:'To Do',progress:'In Progress',done:'✓ Done'},NEXT={todo:'progress',progress:'done',done:'todo'};
const COL=['#2f5d50','#b45309','#c2410c','#2b6f8e','#4d7c0f','#0f766e','#9a3412'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((new Date(s+'T00:00')-new Date(ymd(new Date())+'T00:00'))/864e5);
const cls=id=>S.classes.find(c=>c.id==id)||{name:'No class',color:'#999'};
let view='home',F={q:'',type:'all',cls:'',status:'',due:''},Q='',ob=1,obc=[];
const note=()=>`<p class="note">${ic('vault')}<span>Everything in ClassVault is stored only on this device. It isn't synced to other devices, and deleting the app will erase it. Only Smart Import sends anything off your device: the text you paste into it goes to an AI service.</span></p>`;
async function shr(id){const i=S.items.find(x=>x.id==id);try{const b=await bget(i.att.id),f=new File([b],i.att.name,{type:i.att.type});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('Sharing is not available')}catch(e){if(!e||e.name!='AbortError')toast('Could not share the file')}}
/* ---- Workload engine (on-device; no data leaves the phone) ---- */
const fmt=m=>m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m';
const dayName=n=>n<=0?'today':n==1?'tomorrow':new Date(Date.now()+n*864e5).toLocaleDateString(undefined,{weekday:'long'});
function mults(){const d=S.items.filter(i=>i.type=='assignment'&&i.status=='done'&&i.est>0&&i.actual>0),r=i=>Math.min(3,Math.max(.4,i.actual/i.est)),g=(d.reduce((a,i)=>a+r(i),0)+2)/(d.length+2);
 return{g,n:d.length,c:id=>{const x=d.filter(i=>i.cls==id);return{m:(x.reduce((a,i)=>a+r(i),0)+2*g)/(x.length+2),n:x.length}}}}
function plan(cap,M){const T=asg().map(i=>{const x=M.c(i.cls);return{i,x,p:Math.max(5,Math.round((i.est||45)*x.m/5)*5),d:i.due?Math.max(diff(i.due),0):14}}),used={};
 [...T].sort((a,b)=>b.d-a.d).forEach(t=>{let left=t.p,day=t.d;t.start=t.d;while(left>0&&day>=0){const k=Math.min(cap-(used[day]||0),left);if(k>0){used[day]=(used[day]||0)+k;left-=k;t.start=day}day--}t.over=left});
 T.forEach(t=>{const adj=t.i.est&&t.x.n>=2&&Math.abs(t.x.m-1)>=.1?` You usually take ${t.x.m.toFixed(1)}× your estimate in this class, so I adjusted it.`:'';
  t.why=(t.over>0?`This won't fully fit in ${S.hours} h a day: about ${fmt(t.over)} short. Start now.`:t.start==0?`With your other work, it has to start today to finish before it's due.`:`There's room: it can wait until ${dayName(t.start)} and still fit.`)+adj+(t.i.est?'':' No estimate set, so I assumed 45 min.')});
 return T.sort((a,b)=>(b.over>0)-(a.over>0)||a.start-b.start||a.d-b.d||b.p-a.p)}
const dueTxt=i=>{if(!i.due)return'no due date';const d=diff(i.due);return d<=0?(d<0?'overdue':'due today'):d==1?'due tomorrow':'due '+new Date(i.due+'T00:00').toLocaleDateString(undefined,{weekday:'long'})};
const rec=(t,k)=>{const c=cls(t.i.cls),l=t.over>0||t.start==0?['Start today','c-red']:t.start==1?['Start tomorrow','c-amb']:['Start '+dayName(t.start),''];
 return`<article class="card"><div class="row"><span class="ico"><b>${k+1}</b></span><div class="grow"><h3>${esc(t.i.title)}</h3><small style="color:${c.color}">● ${esc(c.name)}</small></div><span class="chip ${l[1]}">${l[0]}</span></div><p style="color:var(--tx);margin:8px 0 2px">About ${fmt(t.p)} · ${dueTxt(t.i)}</p><p style="margin:0">${t.why}</p><div class="row"><span class="grow"></span><button class="ghost" data-a="edit" data-id="${t.i.id}">Edit</button></div></article>`};
function planPg(){const M=mults(),T=plan(S.hours*60,M),L=S.classes.map(c=>({c,x:M.c(c.id)})).filter(o=>o.x.n>0),dm=S.items.some(i=>i.demo);
 return`<button class="ghost" data-a="go" data-id="home">${ic('back')} Home</button><h1>Workload plan</h1><p>Hours you can work per day <select id="hrs" style="width:auto;display:inline-block;margin:0 0 0 6px">${[1,2,3,4,5,6].map(h=>`<option value="${h}" ${h==S.hours?'selected':''}>${h} h</option>`).join('')}</select></p>
 ${T.length?`<p>${T.length} tasks · about ${fmt(T.reduce((a,t)=>a+t.p,0))} of work, in the order I'd do them</p>`+T.map(rec).join(''):'<div class="empty">Nothing to plan yet.\nAdd assignments with a due date and an estimated time, or paste them into Smart Import.</div><br><button class="btn" data-a="si">'+ic('spark')+' Smart Import (AI)</button>'}
 <h2>What ClassVault has learned</h2>${L.length?L.map(o=>`<div class="card"><b>${esc(o.c.name)}</b><br><small>${o.x.n} finished · ${o.x.m>1.1?`you take ${o.x.m.toFixed(1)}× your estimates`:o.x.m<.9?`you finish faster than you estimate (${o.x.m.toFixed(1)}×)`:'your estimates are close'}</small></div>`).join(''):'<div class="empty">Finish a few assignments and say how long they took. Predictions adapt to you.</div>'}
 <p>${dm?'<button class="ghost danger" data-a="demox">Clear demo data</button>':'<button class="ghost" data-a="demo">Load demo data (for judges)</button>'}</p>`}
function ask(i){modal(`<h1 style="font-size:22px">How long did it take?</h1><p>${i.est?'You estimated '+fmt(i.est)+'. ':''}This helps ClassVault predict your next assignments.</p><div class="types" style="grid-template-columns:repeat(3,1fr)">${[15,30,45,60,90,120].map(m=>`<button data-a="act" data-id="${i.id}" data-m="${m}" style="padding:14px 4px">${fmt(m)}</button>`).join('')}</div><br><button class="btn2" style="width:100%" data-a="x">Skip</button>`)}
function demo(){const cs=[['Biology','#2f5d50'],['World History','#b45309'],['Algebra','#2b6f8e']].map(([name,color])=>({id:uid(),name,color,demo:1}));S.classes.push(...cs);const[b,h,a]=cs.map(c=>c.id);
 const add=(title,cls,due,est,status,actual)=>S.items.push({id:uid(),type:'assignment',title,cls,desc:'',link:'',due:addD(due),est,status:status||'todo',actual:actual||0,created:Date.now()-S.items.length,demo:1});
 [['Unit 4 essay',h,-9,60,'done',90],['Chapter 5 quiz',h,-6,30,'done',40],['Map analysis',h,-3,45,'done',60],['Problem set 3.1',a,-8,40,'done',30],['Problem set 3.2',a,-5,40,'done',32],['Quiz review',a,-2,30,'done',24],['Cell lab report',b,-7,60,'done',75],
 ['Photosynthesis write-up',b,1,60],['Essay draft',h,3,90],['Problem set 3.3',a,2,40],['Vocabulary review',h,2,20],['Group project outline',b,6,120]].forEach(r=>add(...r));persist();render();toast('Demo data loaded.')}
/* ---- Smart Import: the ONLY feature that sends text off the device. The AI runs behind the ClassVault Worker (worker/); there is no API key in this file. ---- */
let SMART_IMPORT_URL='https://classvault-smart-import.classvault.workers.dev/api/smart-import';
const SI_MAX=4000,SI_KINDS=['homework','reading','essay','project','quiz','test','lab','other'],SI_EST=[15,30,45,60,90,120,180,240];
P.spark='<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z"/>';
let SI={text:'',tasks:[],err:''};
const siDate=s=>typeof s=='string'&&/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(Date.parse(s+'T00:00:00Z'))&&new Date(s+'T00:00:00Z').toISOString().slice(0,10)==s;
const siStr=(v,n)=>typeof v=='string'?v.trim().slice(0,n):'';
function siClean(a){return(Array.isArray(a)?a:[]).slice(0,10).map(t=>{if(!t||typeof t!='object')return null;const m=+t.estimatedMinutes||45;return{title:siStr(t.title,120),cn:siStr(t.className,60),due:siDate(t.dueDate)?t.dueDate:'',est:SI_EST.reduce((p,c)=>Math.abs(c-m)<Math.abs(p-m)?c:p,45),kind:SI_KINDS.includes(t.type)?t.type:'other',steps:(Array.isArray(t.subtasks)?t.subtasks:[]).slice(0,8).map(x=>siStr(x,120)).filter(Boolean)}}).filter(t=>t&&t.title)}
function siMsg(e){const c=e&&e.c||(e&&e.name=='AbortError'?'ai_timeout':'network'),w=e&&e.retry>3600?' Try again tomorrow.':e&&e.retry?` Try again in ${Math.ceil(e.retry/60)} min.`:'';
 return({network:"Couldn't reach Smart Import. Check your connection. Everything else in ClassVault still works.",not_configured:'Smart Import is not set up in this build.',rate_limited:e&&e.scope=='global'?'Smart Import is very busy today. Try again tomorrow.':"You've reached the Smart Import limit."+w,too_large:'That text is too long. Paste a smaller section.',empty_input:'Paste some assignment text first.',invalid_ai_response:"The AI's answer couldn't be used. Try rewording or pasting less text.",ai_timeout:'Smart Import took too long. Try again.',ai_busy:'The AI service is busy. Try again in a minute.',ai_budget_used:"Today's free AI budget has been used. Smart Import will be back tomorrow. You can still add assignments yourself."})[c]||'Something went wrong with Smart Import. Try again.'}
function siOpen(){SI={text:'',tasks:[],err:''};S.aiConsent?siPaste():modal(`<h1 style="font-size:22px">Before you use Smart Import</h1><p>Smart Import sends the text you paste to ClassVault's AI service, which processes it with an AI model (Meta Llama 3.1) running on Cloudflare Workers AI. Your text leaves this device. Don't paste names, grades or anything private. ClassVault doesn't keep your text, and Cloudflare's documentation says it doesn't use content sent to Workers AI to train models.</p><p><small>Built with Llama.</small></p><p>The rest of ClassVault stays on your device.</p><div class="row" style="margin-top:14px"><button class="btn2 grow" data-a="x">Cancel</button><button class="btn grow" data-a="siok">I understand</button></div>`)}
function siPaste(){modal(`<h1 style="font-size:22px">Smart Import</h1><p>Paste assignment instructions, a syllabus section or a messy list.</p><textarea id="si-text" rows="8" maxlength="${SI_MAX}" placeholder="e.g. Read chapters 4–5 for Monday, answer questions 1–10, and write a 500-word response.">${esc(SI.text)}</textarea><small style="color:var(--mu)"><span id="si-n">${SI.text.length}</span> / ${SI_MAX}</small>${SI.err?`<p role="alert" style="color:var(--red)">${esc(SI.err)}</p>`:''}<br><br><div class="row"><button class="btn2 grow" data-a="x">Cancel</button><button class="btn grow" data-a="sirun">${ic('spark')} Analyze with AI</button></div>`)}
async function siRun(){if(SI.busy)return;SI.text=$('#si-text')?$('#si-text').value:SI.text;const text=SI.text.trim();
 if(!text){SI.err='Paste some assignment text first.';return siPaste()}
 if(text.length>SI_MAX){SI.err='That text is too long. Paste a smaller section.';return siPaste()}
 if(!S.did){S.did='d'+uid()+uid()+uid();persist()}
 SI.busy=1;modal(`<h1 style="font-size:22px">Analyzing…</h1><p>Reading your text and pulling out assignments. This usually takes a few seconds.</p><div class="empty" aria-busy="true">Working…</div>`);
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
 try{if(SMART_IMPORT_URL.includes('YOUR-WORKER'))throw{c:'not_configured'};

 else if(a=='delc')cfm('Delete this class and everything saved in it?',()=>{S.classes=S.classes.filter(x=>x.id!=id);S.items.filter(x=>x.cls==id&&x.att).forEach(x=>bdel(x.att.id).catch(()=>{}));S.items=S.items.filter(x=>x.cls!=id);persist();modal('');view='classes';render();toast('Class deleted.')});

 else if(a=='renc'){modal(`<h1 style="font-size:22px">Rename class</h1><br><input id="nc" value="${esc(cls(id).name)}"><button class="btn" data-a="renc2" data-id="${id}">Save</button>`)}
 else if(a=='renc2'){const n=$('#nc').value.trim();if(!n)return toast('Enter a name');if(S.classes.some(c=>c.id!=id&&c.name.toLowerCase()==n.toLowerCase()))return toast('That class already exists');cls(id).name=n;persist();modal('');render();toast('Class renamed.')}
 else if(a=='shr')shr(id);else if(a=='lnk')window.open(S.items.find(x=>x.id==id).link,'_blank','noopener');
 else if(a=='yes')cfm.f();else if(a=='x')modal('');
 else if(a=='addc'){modal(`<h1 style="font-size:22px">Add a class</h1><br><input id="nc" placeholder="Class name"><button class="btn" data-a="addc2">Add Class</button>`);setTimeout(()=>$('#nc')?.focus(),50)}
 else if(a=='addc2'){const n=$('#nc').value.trim();if(!n)return toast('Enter a name');if(S.classes.some(c=>c.name.toLowerCase()==n.toLowerCase()))return toast('That class already exists');S.classes.push({id:uid(),name:n,color:COL[S.classes.length%COL.length]});persist();modal('');render();toast('Class added.')}
 else if(a=='ft'){F.type=id;render()}else if(a=='on'){ob++;render()}else if(a=='orm'){obc.splice(id,1);render()}
 else if(a=='oadd'){const v=$('#oc').value.trim();if(v&&!obc.some(c=>c.toLowerCase()==v.toLowerCase())){obc.push(v);render()}}
 else if(a=='fin'){S.user={name:'Guest'};S.classes=obc.map((n,i)=>({id:uid(),name:n,color:COL[i%COL.length]}));persist();render()}});
document.addEventListener('input',e=>{if(e.target.id=='si-text'){SI.text=e.target.value;const n=$('#si-n');if(n)n.textContent=e.target.value.length}if(e.target.id=='vq'){F.q=e.target.value;$('#res').innerHTML=vres()}if(e.target.id=='sq'){Q=e.target.value;$('#sres').innerHTML=sres()}});
document.addEventListener('change',e=>{if(e.target.id=='hrs'){S.hours=+e.target.value;persist();render();return}if(e.target.id=='f-f'||e.target.id=='f-cam'){pick(e.target.files[0]);e.target.value='';return}const f=e.target.dataset.f;if(f){F[f]=e.target.value;$('#res').innerHTML=vres()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')modal('');if(e.key=='Enter'&&e.target.id=='oc')$('[data-a=oadd]').click();if(e.key=='Enter'&&e.target.id=='nc')($('[data-a=addc2]')||$('[data-a=renc2]')).click()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&!$('#modal').classList.contains('on'))render()});
render();
</script></body></html>
